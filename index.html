<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>微信射击小游戏</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <span id="score">得分：0</span>
        <span id="lives">生命：3</span>
        <span id="level">关卡：1</span>
      </header>

      <section class="canvas-wrap">
        <canvas id="game" width="360" height="640" aria-label="射击游戏画布"></canvas>
        <button id="startBtn" class="overlay-btn">开始游戏</button>
        <div id="gameOver" class="overlay hidden">
          <p id="finalText">游戏结束</p>
          <button id="restartBtn">再来一局</button>
        </div>
      </section>

      <footer class="controls" aria-label="触控操作区域">
        <div class="pad">
          <button id="leftBtn" class="ctrl">←</button>
          <button id="rightBtn" class="ctrl">→</button>
        </div>
        <button id="fireBtn" class="fire">开火</button>
      </footer>
    </main>

    <script src="game.js"></script>
  </body>
</html>
